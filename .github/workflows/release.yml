name: CD / Publish Android release

on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudbox-release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish signed APKs
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Check out the exact CI-verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Create temporary debug signing key for tag validation
        if: github.event_name == 'push'
        run: >-
          keytool -genkeypair -noprompt
          -keystore "$GITHUB_WORKSPACE/debug.keystore"
          -storepass android -keypass android -alias androiddebugkey
          -keyalg RSA -keysize 2048 -validity 10000
          -dname "CN=Android Debug,O=Android,C=US"
      - name: Run validation for version tags
        if: github.event_name == 'push'
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Resolve release version
        id: release
        env:
          SOURCE_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          if [[ "$SOURCE_BRANCH" == "main" ]]; then
            tag="latest"
            title="CloudBox Latest Build (${SOURCE_SHA:0:7})"
            version_name="1.0.0-dev.${RELEASE_RUN_NUMBER}"
            # Not a prerelease: keeps the stable /releases/latest/download/... URL working
            # and lets the in-app updater treat this rolling build as the current release.
            prerelease="false"
          else
            tag="${SOURCE_BRANCH#refs/tags/}"
            version_name="${tag#v}"
            title="CloudBox ${tag}"
            prerelease="false"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SOURCE_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          has_any_secret=false
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then has_any_secret=true; fi
          done

          if [[ "$SOURCE_BRANCH" != "main" || "$has_any_secret" == "true" ]]; then
            for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [[ -z "${!name}" ]]; then
                echo "::error::All signing secrets are required for versioned releases (and must be configured together). Missing: $name"
                exit 1
              fi
            done
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cloudbox-release.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/cloudbox-release.jks"
              echo "STORE_PASSWORD=$STORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No persistent signing key configured. This rolling preview uses a temporary key and cannot update installs signed by another key. Configure the repository signing secrets before distributing this build broadly."
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/cloudbox-preview.jks" \
              -alias preview -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=CloudBox CI Preview, O=CloudBox, C=US"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/cloudbox-preview.jks"
              echo "STORE_PASSWORD=android"
              echo "KEY_ALIAS=preview"
              echo "KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
          fi
      - name: Build split release APKs
        env:
          APP_VERSION_NAME: ${{ steps.release.outputs.version_name }}
          APP_VERSION_CODE: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: >-
          ./gradlew --no-daemon :app:assembleRelease -PsplitApks
          -PappVersionName="$APP_VERSION_NAME"
          -PappVersionCode="$APP_VERSION_CODE"
          -PgitSha="${SOURCE_SHA:0:7}"
      - name: Prepare APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="app/build/outputs/apk/release"
          artifact_dir="release-artifacts"
          mkdir -p "$artifact_dir"
          cp "$apk_dir/app-arm64-v8a-release.apk" "$artifact_dir/CloudBox-arm64-v8a-release.apk"
          cp "$apk_dir/app-armeabi-v7a-release.apk" "$artifact_dir/CloudBox-armeabi-v7a-release.apk"
          cp "$apk_dir/app-universal-release.apk" "$artifact_dir/CloudBox-universal-release.apk"
          (
            cd "$artifact_dir"
            sha256sum ./*.apk > checksums-sha256.txt
            sha256sum --check checksums-sha256.txt
          )
      - name: Upload release APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudbox-${{ steps.release.outputs.tag }}-release-apks
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Move rolling tag to the verified commit
        if: steps.release.outputs.tag == 'latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          status_code=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
            -d "{\"sha\":\"${TAG_SHA}\",\"force\":true}" || true)
          if [[ "$status_code" == "200" ]]; then
            echo "Tag 'latest' moved to ${TAG_SHA}"
          else
            echo "Tag 'latest' not found yet (HTTP ${status_code}); the release step will create it."
          fi
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.title }}
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          draft: false
          files: release-artifacts/*
          generate_release_notes: true
          body: |
            <!-- cloudbox-build sha=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }} run=${{ github.run_number }} -->

            ## CloudBox Android ${{ steps.release.outputs.tag }}

            Built from verified commit `${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}`.

            APKs are split for arm64-v8a and armeabi-v7a and include a universal build. Verify downloaded files with `checksums-sha256.txt`.

            **Stable download link (always the newest build):**
            `https://github.com/${{ github.repository }}/releases/latest/download/CloudBox-universal-release.apk`

            The CloudBox app checks this release automatically and offers to download and install updates in place. Rolling builds are signed with the persistent repository signing key, so updates install over previous builds without uninstalling.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write release summary
        if: always()
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: |
          {
            echo "## Android release pipeline"
            echo "- Tag: \`${RELEASE_TAG:-not resolved}\`"
            echo "- App version: \`${VERSION_NAME:-not resolved}\`"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Source run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
